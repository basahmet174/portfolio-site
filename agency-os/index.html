<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Mind — Agency OS</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f7f5;font-family:Inter,system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#6d706a;font-size:14px;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="loading" id="loading">Agency OS yükleniyor…</div>
<script>
(async()=>{
  try{
    const urls=['payload-1.txt','payload-2.txt','payload-3.txt'];
    const parts=await Promise.all(urls.map(async u=>{
      const r=await fetch(u+'?v=6',{cache:'no-store'});
      if(!r.ok) throw new Error(u+' yüklenemedi ('+r.status+')');
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('Tarayıcı gzip açmayı desteklemiyor.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    const override=`<style id="mm-light-buttons">
      :root{--primary:#e9eeeb !important;--primary-foreground:#24302b !important;}
      #mm-agency-os .btn.primary{background:#fff !important;color:#24302b !important;border-color:#d8dfda !important;box-shadow:0 1px 2px rgba(25,26,29,.05) !important;}
      #mm-agency-os .btn.primary:hover{background:#eef2ef !important;color:#24302b !important;border-color:#cfd8d2 !important;}
      #mm-agency-os .os-nav button.active{background:#eef2ef !important;color:#24302b !important;box-shadow:inset 0 0 0 1px #d8dfda !important;}
      #mm-agency-os .msg.user{background:#eef2ef !important;color:#24302b !important;border:1px solid #d8dfda !important;}
      #mm-agency-os .toast{background:#fff !important;color:#24302b !important;border:1px solid #d8dfda !important;box-shadow:0 10px 30px rgba(25,26,29,.12) !important;}
    </style>`;
    html=html.replace('</head>',override+'</head>');
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='Agency OS yüklenemedi.<br><small>'+String(e.message||e)+'<br>Sayfayı yenileyip tekrar deneyin.</small>';
  }
})();
</script>
</body>
</html>
